workflows:
  kivy-android-build:
    name: Kivy Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies and Buildozer
        script: |
          pip install --upgrade pip
          pip install buildozer cython
      - name: Fix Android SDK/NDK Environment
        script: |
          # Codemagic ke default environment variables ko spec file ke mutabiq sync karna
          export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
          export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b
      - name: Build Android APK
        script: |
          yes | buildozer -v android debug
    artifacts:
      - bin/*.apk
